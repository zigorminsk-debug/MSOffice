name: Test and build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build-windows:
    name: Windows application
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build portable application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name "Fitnes"
          --icon "assets/fitnes-icon.ico"
          --collect-all flask
          --add-data "finance_balance/templates;finance_balance/templates"
          --add-data "finance_balance/static;finance_balance/static"
          run.py
      - name: Verify and checksum
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Fitnes/Fitnes.exe")) { exit 1 }
          $hash = (Get-FileHash "dist/Fitnes/Fitnes.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Fitnes.exe" | Out-File "dist/Fitnes/SHA256SUMS.txt" -Encoding ascii
          Get-Item "dist/Fitnes/Fitnes.exe"
          Get-Content "dist/Fitnes/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Fitnes-Windows-Portable
          path: dist/Fitnes/
          if-no-files-found: error
          retention-days: 30
